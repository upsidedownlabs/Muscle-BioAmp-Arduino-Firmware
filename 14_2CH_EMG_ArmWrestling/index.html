<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioArm Wrestling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #F7F5FC;
      --surface: #FFFFFF;
      --border: #E7E1F5;
      --text: #1C1533;
      --text-muted: #7C7593;
      --primary: #6D28D9;
      --primary-dark: #4C1D95;
      --primary-soft: #F0E9FD;
      --p1: #0FA36B;
      /* channel 1 — UDL teal-green (their PCB colour) */
      --p1-soft: #E3F7EE;
      --p2: #6D28D9;
      /* channel 2 — UDL violet */
      --p2-soft: #F0E9FD;
      --danger: #E5484D;
      --shadow: 0 1px 2px rgba(28, 21, 51, 0.04), 0 8px 24px rgba(28, 21, 51, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background:
        radial-gradient(circle at 1px 1px, rgba(109, 40, 217, 0.08) 1px, transparent 0) 0 0/28px 28px,
        var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 60px;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.28em;
      color: var(--primary);
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: clamp(28px, 4.6vw, 44px);
      letter-spacing: -0.01em;
      margin-top: 6px;
      color: var(--text);
    }

    h1 span {
      color: var(--primary);
    }

    .topbar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin: 26px 0 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .status-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: .2s;
    }

    .status-pill.live .dot {
      background: var(--p1);
      box-shadow: 0 0 0 4px var(--p1-soft);
    }

    .status-pill.live {
      color: var(--p1);
      border-color: var(--p1-soft);
    }

    button {
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: .15s;
      box-shadow: var(--shadow);
    }

    button:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.primary:hover:not(:disabled) {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
    }

    button.danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .arena {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 220px 1fr;
      gap: 18px;
      align-items: stretch;
    }

    @media (max-width:820px) {
      .arena {
        grid-template-columns: 1fr;
      }

      .gauge-col {
        order: 2;
      }

      .panel.p2 {
        order: 3;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      box-shadow: var(--shadow);
    }

    .panel.p1 {
      border-top: 3px solid var(--p1);
    }

    .panel.p2 {
      border-top: 3px solid var(--p2);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .chan-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .p1 .chan-label {
      color: var(--p1);
      background: var(--p1-soft);
    }

    .p2 .chan-label {
      color: var(--p2);
      background: var(--p2-soft);
    }

    input.name {
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--border);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 23px;
      padding: 4px 2px 8px;
      width: 100%;
      outline: none;
    }

    .p1 input.name:focus {
      border-color: var(--p1);
    }

    .p2 input.name:focus {
      border-color: var(--p2);
    }

    canvas.trace {
      width: 100%;
      height: 110px;
      border-radius: 10px;
      background: linear-gradient(180deg, #FBFAFE, #F5F2FC);
      display: block;
      border: 1px solid var(--border);
    }

    .strength-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .strength-track {
      flex: 1;
      height: 9px;
      border-radius: 6px;
      background: var(--bg);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      transition: width .06s linear;
    }

    .p1 .strength-fill {
      background: var(--p1);
    }

    .p2 .strength-fill {
      background: var(--p2);
    }

    .strength-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
      width: 44px;
      text-align: right;
    }

    .gauge-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 10px;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .vs {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.06em;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 14px;
      border-radius: 999px;
    }

    .gauge-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    svg.gauge {
      height: 100%;
      max-height: 380px;
    }

    .cal-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      min-height: 16px;
    }

    .controls {
      width: 100%;
      max-width: 1100px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 26px;
    }

    .log {
      width: 100%;
      max-width: 1100px;
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.02em;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 21, 51, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      z-index: 20;
    }

    .overlay.show {
      display: flex;
    }

    .win-card {
      text-align: center;
      padding: 40px 60px;
      border-radius: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(28, 21, 51, 0.18);
    }

    .win-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.3em;
      font-size: 12px;
      color: var(--text-muted);
    }

    .win-name {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: clamp(38px, 6.5vw, 64px);
      margin: 10px 0 24px;
    }

    .win-name.p1 {
      color: var(--p1);
    }

    .win-name.p2 {
      color: var(--p2);
    }

    /* ---- arm-wrestle motifs ---- */
    .muscle-icon {
      flex-shrink: 0;
    }

    .p1 .chan-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .p2 .chan-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes flex-pulse {

      0%,
      100% {
        box-shadow: var(--shadow);
      }

      50% {
        box-shadow: 0 0 0 3px var(--glow-color, var(--primary-soft)), var(--shadow);
      }
    }

    .panel.flexing {
      animation: flex-pulse 0.6s ease-in-out infinite;
    }

    .panel.p1.flexing {
      --glow-color: var(--p1-soft);
      border-top-color: var(--p1);
    }

    .panel.p2.flexing {
      --glow-color: var(--p2-soft);
      border-top-color: var(--p2);
    }

    .bicep-mini {
      transition: transform .08s ease-out;
      transform-origin: center;
    }

    .fiber-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
    }

    .clash-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .clash-badge svg {
      width: 34px;
      height: 22px;
    }
  </style>
</head>

<body>

  <div class="eyebrow">Upside&nbsp;Down&nbsp;Labs&nbsp;·&nbsp;BioAmp&nbsp;EXG&nbsp;Pill</div>
  <h1>BioArm <span>Wrestling</span></h1>

  <div class="topbar">
    <div class="status-cluster">
      <div class="status-pill" id="connPill"><span class="dot"></span><span id="connText">Not connected</span></div>
      <div class="status-pill" id="statePill"><span class="dot"></span><span id="stateText">Idle</span></div>
    </div>
    <div style="display:flex;gap:10px;">
      <button id="connectBtn" class="primary">Connect to Arduino</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
    </div>
  </div>

  <div class="arena">
    <div class="panel p1">
      <div class="panel-head">
        <span class="chan-label">
          <svg class="muscle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0FA36B"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 20c0-5 1-8 1-11 0-3 2-5 5-5s4 2 4 4c2 0 4 1 4 4 0 4-1 5-1 8-1 2-3 3-6 3-3 0-5-1-7-3z" />
            <path d="M9 9c1 1 3 1 4 0" />
          </svg>
          CH.1 · A0 · CLOSE THE CLAW
        </span>
      </div>
      <input class="name" id="p1Name" value="Player 1" maxlength="16">
      <canvas class="trace" id="p1Canvas"></canvas>
      <div class="strength-row">
        <div class="strength-track">
          <div class="strength-fill" id="p1Fill"></div>
        </div>
        <span class="strength-num" id="p1Num">0</span>
      </div>
    </div>

    <div class="gauge-col">
      <div class="clash-badge">
        <svg viewBox="0 0 60 34" fill="none">
          <path d="M6 20c4-2 8-2 11 1l4 4" stroke="#0FA36B" stroke-width="3.4" stroke-linecap="round" />
          <path d="M54 20c-4-2-8-2-11 1l-4 4" stroke="#6D28D9" stroke-width="3.4" stroke-linecap="round" />
          <circle cx="24" cy="27" r="4.5" fill="#0FA36B" />
          <circle cx="36" cy="27" r="4.5" fill="#6D28D9" />
          <path d="M27 12l3-5 3 5-3 3z" fill="#F5A623" />
        </svg>
        <span class="vs">VS</span>
      </div>
      <div class="gauge-wrap">
        <svg class="gauge" viewBox="0 0 100 380" preserveAspectRatio="xMidYMid meet">
          <line x1="50" y1="30" x2="50" y2="350" stroke="#E7E1F5" stroke-width="6" stroke-linecap="round" />
          <!-- CH.1 grip -->
          <g transform="translate(50,20)">
            <circle r="12" fill="#E3F7EE" stroke="#0FA36B" stroke-width="2" />
            <path d="M-5 -1c0-3 2-5 5-5s5 2 5 5v3c0 3-2 5-5 5s-5-2-5-5z" fill="#0FA36B" />
          </g>
          <!-- CH.2 grip -->
          <g transform="translate(50,360)">
            <circle r="12" fill="#F0E9FD" stroke="#6D28D9" stroke-width="2" />
            <path d="M-5 -1c0-3 2-5 5-5s5 2 5 5v3c0 3-2 5-5 5s-5-2-5-5z" fill="#6D28D9" />
          </g>
          <!-- clasped-fist marker: slides between the two grips -->
          <g id="marker">
            <circle cx="50" cy="190" r="15" fill="#fff" stroke="#1C1533" stroke-width="1.4" stroke-opacity="0.08" />
            <path d="M43 184c0-3 2-5 5-5s5 2 5 5v5c0 3-2 5-5 5s-5-2-5-5z" fill="#F5A623" />
          </g>
        </svg>
      </div>
      <div class="cal-readout" id="calReadout">Connect the board to begin</div>
    </div>

    <div class="panel p2">
      <div class="panel-head">
        <span class="chan-label">
          <svg class="muscle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6D28D9"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 20c0-5 1-8 1-11 0-3 2-5 5-5s4 2 4 4c2 0 4 1 4 4 0 4-1 5-1 8-1 2-3 3-6 3-3 0-5-1-7-3z" />
            <path d="M9 9c1 1 3 1 4 0" />
          </svg>
          CH.2 · A1 · OPEN THE CLAW
        </span>
      </div>
      <input class="name" id="p2Name" value="Player 2" maxlength="16" style="text-align:right;">
      <canvas class="trace" id="p2Canvas"></canvas>
      <div class="strength-row">
        <span class="strength-num" id="p2Num">0</span>
        <div class="strength-track">
          <div class="strength-fill" id="p2Fill"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn" class="primary" disabled>Start Duel</button>
    <button id="rematchBtn" disabled>Rematch</button>
    <button id="newOppBtn" disabled>New Opponents</button>
  </div>

  <div class="log" id="logLine">Plug in the Uno R4 Minima, then click "Connect to Arduino".</div>

  <div class="overlay" id="winOverlay">
    <div class="win-card">
      <div class="win-eyebrow">WINNER</div>
      <div class="win-name" id="winName">—</div>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button class="primary" id="overlayRematch">Rematch</button>
        <button id="overlayNewOpp">New Opponents</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const connectBtn = $('connectBtn'), disconnectBtn = $('disconnectBtn');
      const connPill = $('connPill'), connText = $('connText');
      const statePill = $('statePill'), stateText = $('stateText');
      const startBtn = $('startBtn'), rematchBtn = $('rematchBtn'), newOppBtn = $('newOppBtn');
      const calReadout = $('calReadout'), logLine = $('logLine');
      const p1Fill = $('p1Fill'), p2Fill = $('p2Fill'), p1Num = $('p1Num'), p2Num = $('p2Num');
      const marker = $('marker');
      const winOverlay = $('winOverlay'), winName = $('winName');
      const p1NameInput = $('p1Name'), p2NameInput = $('p2Name');

      let port, reader, writer, keepReading = false;
      // Web Serial streams give/take raw bytes (Uint8Array), not strings.
      // We pipe through TextDecoderStream/TextEncoderStream so reader.read()
      // yields text chunks and writer.write() accepts plain strings.
      let textDecoder, readableStreamClosed, textEncoder, writableStreamClosed;
      let lineBuffer = '';
      let gameState = 'idle'; // idle | calibrating | playing | gameover

      const MAX_STRENGTH = 150; // matches the 150.0f envelope clamp on the board

      // ---- rolling waveform traces (UDL channel colours: teal-green / violet) ----
      function makeTrace(canvasId, color) {
        const canvas = $(canvasId);
        const ctx = canvas.getContext('2d');
        let data = [];
        function resize() {
          const rect = canvas.getBoundingClientRect();
          canvas.width = rect.width * devicePixelRatio;
          canvas.height = rect.height * devicePixelRatio;
        }
        resize();
        window.addEventListener('resize', resize);
        function push(v) {
          data.push(v);
          if (data.length > 160) data.shift();
          draw();
        }
        function draw() {
          const w = canvas.width, h = canvas.height;
          ctx.clearRect(0, 0, w, h);
          // faint gridlines
          ctx.strokeStyle = 'rgba(28,21,51,0.06)';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
          if (data.length < 2) return;

          // filled area under the trace
          ctx.beginPath();
          data.forEach((v, i) => {
            const x = (i / (159)) * w;
            const norm = Math.min(v / MAX_STRENGTH, 1);
            const y = h - norm * h * 0.9 - 6;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          });
          ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
          ctx.fillStyle = color + '1a';
          ctx.fill();

          // trace line
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.4 * devicePixelRatio;
          ctx.lineJoin = 'round';
          ctx.beginPath();
          data.forEach((v, i) => {
            const x = (i / (159)) * w;
            const norm = Math.min(v / MAX_STRENGTH, 1);
            const y = h - norm * h * 0.9 - 6;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          });
          ctx.stroke();
        }
        function reset() { data = []; draw(); }
        return { push, reset };
      }
      const p1Trace = makeTrace('p1Canvas', '#0FA36B');
      const p2Trace = makeTrace('p2Canvas', '#6D28D9');

      function setConnected(isConn) {
        connectBtn.disabled = isConn;
        disconnectBtn.disabled = !isConn;
        startBtn.disabled = !isConn;
        connPill.classList.toggle('live', isConn);
        connText.textContent = isConn ? 'Connected' : 'Not connected';
      }
      function setGameState(s) {
        gameState = s;
        statePill.classList.toggle('live', s === 'playing');
        rematchBtn.disabled = s === 'idle';
        newOppBtn.disabled = s === 'idle';
        startBtn.disabled = (s !== 'idle');
      }

      function log(msg) { logLine.textContent = msg; }

      // ---- Web Serial plumbing ----
      async function connect() {
        try {
          if (!port) {
            const ports = await navigator.serial.getPorts();
            if (ports.length) {
              port = ports[0];
            } else {
              port = await navigator.serial.requestPort();
            }
          }

          await openPort();
        } catch (e) {
          log("Connection failed: " + e.message);
        }
      }
      async function openPort() {
        await port.open({ baudRate: 115200 });

        // Decode incoming bytes to text before we ever touch lineBuffer.
        textDecoder = new TextDecoderStream();
        readableStreamClosed = port.readable.pipeTo(textDecoder.writable).catch(() => { });
        reader = textDecoder.readable.getReader();

        // Encode outgoing strings to bytes before they hit the port.
        textEncoder = new TextEncoderStream();
        writableStreamClosed = textEncoder.readable.pipeTo(port.writable).catch(() => { });
        writer = textEncoder.writable.getWriter();

        keepReading = true;
        lineBuffer = '';
        setConnected(true);
        log('Connected. Waiting for board to say READY…');
        readLoop();
      }
      async function readLoop() {
        try {
          while (keepReading) {
            const { value, done } = await reader.read();
            if (done) break;
            if (value) {
              lineBuffer += value;
              let idx;
              while ((idx = lineBuffer.indexOf('\n')) >= 0) {
                const line = lineBuffer.slice(0, idx).trim();
                lineBuffer = lineBuffer.slice(idx + 1);
                if (line) handleLine(line);
              }
            }
          }
        } catch (e) {
          // The board was unplugged (or the port dropped) mid-read.
          if (keepReading) handleDeviceLost();
        }
      }
      async function disconnect() {
        keepReading = false;
        try {
          if (reader) {
            await reader.cancel();
            reader.releaseLock();
          }
        } catch (e) { }
        try {
          if (readableStreamClosed) await readableStreamClosed;
        } catch (e) { }
        try {
          if (writer) {
            await writer.close();
            writer.releaseLock();
          }
        } catch (e) { }
        try {
          if (writableStreamClosed) await writableStreamClosed;
        } catch (e) { }
        try {
          if (port) {
            await port.close();
          }
        } catch (e) { }

        reader = null;
        writer = null;
        textDecoder = null;
        textEncoder = null;
        readableStreamClosed = null;
        writableStreamClosed = null;
        port = null;

        setConnected(false);
        setGameState('idle');
        log('Disconnected.');
      }
      // Fires when the USB cable is pulled or the board loses power unexpectedly —
      // the port object is already dead, so just drop our references and reset the UI.
      function handleDeviceLost() {
        keepReading = false;
        reader = null; writer = null;
        textDecoder = null; textEncoder = null;
        readableStreamClosed = null; writableStreamClosed = null;
        setConnected(false);
        setGameState('idle');
        p1Trace.reset(); p2Trace.reset();
        p1Fill.style.width = '0%'; p2Fill.style.width = '0%';
        p1Panel.classList.remove('flexing'); p2Panel.classList.remove('flexing');
        p1Icon.style.transform = 'scale(1)'; p2Icon.style.transform = 'scale(1)';
        marker.setAttribute('transform', 'translate(0, 0)');
        winOverlay.classList.remove('show');
        log('Board disconnected — plug it back in to reconnect automatically.');
      }

      function runCountdown(cmd) {
        startBtn.disabled = true;
        rematchBtn.disabled = true;
        let n = 3;
        calReadout.textContent = `Get ready… ${n}`;
        const iv = setInterval(() => {
          n--;
          if (n > 0) {
            calReadout.textContent = `Get ready… ${n}`;
          } else {
            clearInterval(iv);
            calReadout.textContent = 'Go!';
            sendCmd(cmd);
          }
        }, 1000);
      }

      async function sendCmd(cmd) {
        if (!writer) return;
        try { await writer.write(cmd + '\n'); } catch (e) { handleDeviceLost(); }
      }

      // try to silently reattach to a previously authorized port
      async function tryAutoReconnect() {
        if (!('serial' in navigator)) return;
        const ports = await navigator.serial.getPorts();
        if (ports.length) {
          port = ports[0];
          try { await openPort(); } catch (e) { /* needs a fresh user gesture, ignore */ }
        }
      }

      // React live to USB unplug/replug events, so the page never needs a refresh.
      if ('serial' in navigator) {
        navigator.serial.addEventListener('disconnect', (event) => {
          if (event.target === port) handleDeviceLost();
        });
        navigator.serial.addEventListener('connect', async (event) => {
          if (!keepReading) {
            port = event.target;
            try { await openPort(); } catch (e) { /* board not fully ready yet, ignore */ }
          }
        });
      }


      // ---- protocol handling ----
      function handleLine(line) {
        const parts = line.split(',');
        switch (parts[0]) {
          case 'READY':
            log('Board is ready. Enter names and click Start Duel.');
            break;
          case 'STARTED':
            setGameState('playing');
            calReadout.textContent = 'Squeeze to pull the gauge to your side!';
            p1Trace.reset(); p2Trace.reset();
            break;
          case 'EMG': {
            const a1 = parseFloat(parts[1]), a2 = parseFloat(parts[2]), angle = parseFloat(parts[3]);
            updateTelemetry(a1, a2, angle);
            break;
          }
          case 'WIN': {
            const who = parts[1];
            const name = who === '1' ? p1NameInput.value : p2NameInput.value;
            winName.textContent = name || (who === '1' ? 'Player 1' : 'Player 2');
            winName.className = 'win-name ' + (who === '1' ? 'p1' : 'p2');
            winOverlay.classList.add('show');
            setGameState('gameover');
            calReadout.textContent = `${name} wins the round`;
            break;
          }
        }
      }

      const p1Panel = document.querySelector('.panel.p1');
      const p2Panel = document.querySelector('.panel.p2');
      const p1Icon = document.querySelector('.panel.p1 .muscle-icon');
      const p2Icon = document.querySelector('.panel.p2 .muscle-icon');
      const FLEX_THRESHOLD = 55; // % of max strength that counts as "flexing"

      function updateTelemetry(a1, a2, angle) {
        p1Trace.push(a1); p2Trace.push(a2);
        const p1pct = Math.min(100, (a1 / MAX_STRENGTH) * 100);
        const p2pct = Math.min(100, (a2 / MAX_STRENGTH) * 100);
        p1Fill.style.width = p1pct + '%';
        p2Fill.style.width = p2pct + '%';
        p1Num.textContent = Math.round(a1);
        p2Num.textContent = Math.round(a2);

        p1Panel.classList.toggle('flexing', p1pct >= FLEX_THRESHOLD);
        p2Panel.classList.toggle('flexing', p2pct >= FLEX_THRESHOLD);
        p1Icon.style.transform = `scale(${1 + (p1pct / 100) * 0.6})`;
        p2Icon.style.transform = `scale(${1 + (p2pct / 100) * 0.6})`;

        // angle range 15 (p1 wins) .. 90 (p2 wins), rest ~45
        const t = (angle - 15) / (90 - 15); // 0..1
        const y = 20 + t * (360 - 20);
        marker.setAttribute('transform', `translate(0, ${y - 190})`);
      }

      // ---- controls ----
      connectBtn.addEventListener('click', connect);
      disconnectBtn.addEventListener('click', disconnect);
      startBtn.addEventListener('click', () => { winOverlay.classList.remove('show'); runCountdown('START'); });
      rematchBtn.addEventListener('click', () => { winOverlay.classList.remove('show'); runCountdown('REMATCH'); });
      $('overlayRematch').addEventListener('click', () => rematchBtn.click());
      newOppBtn.addEventListener('click', () => {
        p1NameInput.value = '';
        p2NameInput.value = '';
        p1NameInput.focus();
        p1Trace.reset(); p2Trace.reset();
        p1Fill.style.width = '0%'; p2Fill.style.width = '0%';
        p1Num.textContent = '0'; p2Num.textContent = '0';
        p1Panel.classList.remove('flexing'); p2Panel.classList.remove('flexing');
        p1Icon.style.transform = 'scale(1)'; p2Icon.style.transform = 'scale(1)';
        marker.setAttribute('transform', 'translate(0, 0)');
        setGameState('idle');
        calReadout.textContent = 'Enter names and click Start Duel';
        winOverlay.classList.remove('show');
        log('New opponents — enter names, then Start Duel.');
      });
      $('overlayRematch').addEventListener('click', () => rematchBtn.click());
      $('overlayNewOpp').addEventListener('click', () => newOppBtn.click());

      if (!('serial' in navigator)) {
        log('This browser does not support Web Serial. Use desktop Chrome or Edge.');
        connectBtn.disabled = true;
      } else {
        tryAutoReconnect();
      }
    })();
  </script>
</body>

</html>
